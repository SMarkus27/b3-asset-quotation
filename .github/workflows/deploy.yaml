    deploy:
#      needs: build
      name: deploy_ec2
      runs-on: ubuntu:latest
      steps:
        - name: Deploy EC2 SSH
          run: |
            echo ${{ secrets.INSTANCE_KEY }} > key.pem
            chmod 400 key.pem
            ssh -i key.pem -o StrictHostKeyChecking=no ec2-user@${{ secrets.PUBLIC_IP }} << EOF
              aws ecr get-login-password --region ${secrets.AWS_REGION} | docker login --username AWS --password-stdin ${{ secrets.AWS_ECR}}
              docker pull ${{ secrets.AWS_ECR_REPO }}:${GITHUB_SHA:0:7}

              docker stop b3-assets || true
              docker rm b3-assets || true

              docker run -d -p 5000:5000 --name b3-assets ${{ secrets.AWS_ECR_REPO }}:${GITHUB_SHA:0:7}

            EOF
            rm key.pem
