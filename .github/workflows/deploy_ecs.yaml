name: Pipeline CI/CD

on:
  push:
    branches:
      - feature/quotation

permissions:
  id-token: write
  contents: read
jobs:
    build:
      name: build_ecr
      runs-on: ubuntu-latest

      #TODO environment ajustar pelo nome da branch
      environment: "prod"
      outputs:
        image-uri: ${{ steps.login-ecr.outputs.registry }}
      steps:
        - name: Checkout
          uses: actions/checkout@v6.0.1

        - name: Configure AWS Credentials Action for GitHub Actions
          uses: aws-actions/configure-aws-credentials@v5.1.1
          with:
            role-to-assume: ${{ secrets.AWS_GITHUB_ROLE }}
            aws-region: ${{ secrets.AWS_REGION }}

        - name: Amazon ECR "Login" Action for GitHub Actions
          id: login-ecr
          uses: aws-actions/amazon-ecr-login@v2.0.1
          with:
            region: ${{ secrets.AWS_REGION }}

        - name: Extract image metadata
          uses: docker/metadata-action@v5
          id: meta-ecr
          with:
            images: ${{secrets.AWS_ECR_REPO}}
            tags: |
              type=sha,format=short
              type=raw,value=dev

        - name: Configurar Docker Buildx
          uses: docker/setup-buildx-action@v3

        - name: Build e push
          uses: docker/build-push-action@v5
          with:
            context: .
            push: true
            tags: ${{ steps.meta-ecr.outputs.tags }}
            labels: ${{ steps.meta-ecr.outputs.labels }}
            cache-from: type=gha
            cache-to: type=gha,mode=max

    deploy:
        name: Deploy ECS
        runs-on: ubuntu-latest
        needs: build

        permissions:
          id-token: write
          contents: read

        steps:
          # 1️⃣ Checkout
          - uses: actions/checkout@v4

          # 2️⃣ AWS via OIDC
          - name: Configure AWS Credentials Action for GitHub Actions
            uses: aws-actions/configure-aws-credentials@v5.1.1
            with:
              role-to-assume: ${{ secrets.AWS_GITHUB_ROLE }}
              aws-region: ${{ secrets.AWS_REGION }}

          - name: Get current task definition
            id: task
            run: |
              aws ecs describe-task-definition \
                --task-definition my-app \
                --query taskDefinition \
                --output json > task-def.json

          - name: Remove read-only fields
            run: |
              jq 'del(
                .taskDefinitionArn,
                .revision,
                .status,
                .requiresAttributes,
                .compatibilities,
                .registeredAt,
                .registeredBy
              )' task-def.json > clean-task-def.json

          - name: Update image in task definition
            id: render
            uses: aws-actions/amazon-ecs-render-task-definition@v1
            with:
              task-definition: clean-task-def.json
              container-name: my-app
              image: ${{ needs.build.outputs.image-uri }}

          - name: Deploy ECS service
            uses: aws-actions/amazon-ecs-deploy-task-definition@v1
            with:
              task-definition: ${{ steps.render.outputs.task-definition }}
              service: my-app-service
              cluster: terraform-cluster-ecs
              wait-for-service-stability: true